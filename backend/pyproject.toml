[project]
name = "vector-alpha"
version = "0.1.0"
description = "Explain the change in your own portfolio: broker history -> variance analysis -> agent reasoning -> advisements -> IBKR paper trades"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pandas>=2.2",
  "numpy>=1.26",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "openai>=1.40",
  "prismtrace-sdk>=0.4.0",
  "tavily-python>=0.5",
  "robin-stocks>=3.4",
  "pyotp>=2.9",
  "sse-starlette>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
